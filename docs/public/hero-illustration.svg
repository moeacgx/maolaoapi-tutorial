<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" fill="none" role="img" aria-label="MaoLao API 文档插画">
  <defs>
    <linearGradient id="bgA" x1="845" y1="68" x2="1112" y2="326" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D7F0FF"/>
      <stop offset="1" stop-color="#F4F7FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bgB" x1="95" y1="676" x2="364" y2="865" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DFFAEF"/>
      <stop offset="1" stop-color="#F4F7FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bgC" x1="1024" y1="456" x2="1178" y2="612" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E2EAFF"/>
      <stop offset="1" stop-color="#F4F7FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panel" x1="150" y1="110" x2="1050" y2="770" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FBFDFF"/>
    </linearGradient>
    <linearGradient id="teal" x1="184" y1="154" x2="430" y2="344" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F766E"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="blue" x1="694" y1="176" x2="951" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E40AF"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#EAFBF7"/>
      <stop offset="1" stop-color="#F7FAFC"/>
    </linearGradient>
    <filter id="blur" x="0" y="0" width="1200" height="900" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="shadow" x="80" y="70" width="1040" height="760" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadow" x="0" y="0" width="1200" height="900" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <clipPath id="clipPanel">
      <rect x="150" y="110" width="900" height="660" rx="40"/>
    </clipPath>
  </defs>

  <circle cx="1018" cy="160" r="190" fill="url(#bgA)" filter="url(#blur)"/>
  <circle cx="220" cy="764" r="180" fill="url(#bgB)" filter="url(#blur)"/>
  <circle cx="1076" cy="562" r="140" fill="url(#bgC)" filter="url(#blur)"/>

  <rect x="150" y="110" width="900" height="660" rx="40" fill="url(#panel)" stroke="#E2E8F0" filter="url(#shadow)"/>

  <g clip-path="url(#clipPanel)">
    <rect x="150" y="110" width="900" height="660" rx="40" fill="none"/>

    <rect x="190" y="150" width="330" height="560" rx="30" fill="#F8FBFD" stroke="#E5EDF5"/>
    <rect x="190" y="150" width="330" height="560" rx="30" fill="none" stroke="url(#teal)" stroke-opacity="0.08"/>

    <rect x="220" y="182" width="138" height="42" rx="21" fill="#E6FFFB" stroke="#A7F3D0"/>
    <text x="289" y="209" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F766E">快速开始</text>

    <text x="220" y="282" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#111827">一站式接入</text>
    <text x="220" y="323" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#111827">文档路径</text>
    <text x="220" y="362" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#64748B">注册、Key、模型、额度与异步生图</text>

    <g filter="url(#softShadow)">
      <rect x="220" y="404" width="272" height="82" rx="22" fill="#FFFFFF" stroke="#DCE6EF"/>
      <circle cx="256" cy="445" r="18" fill="#ECFEFF"/>
      <path d="M250 445.5h12M256 439.5v12" stroke="#0F766E" stroke-width="2.5" stroke-linecap="round"/>
      <text x="290" y="438" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#111827">API Key</text>
      <text x="290" y="463" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">创建并保存你的访问令牌</text>
    </g>

    <g filter="url(#softShadow)">
      <rect x="220" y="500" width="272" height="82" rx="22" fill="#FFFFFF" stroke="#DCE6EF"/>
      <circle cx="256" cy="541" r="18" fill="#EFF6FF"/>
      <path d="M248 543h16M252 537l4-4 4 4" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="290" y="534" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#111827">模型选择</text>
      <text x="290" y="559" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">支持文本与图片模型</text>
    </g>

    <g filter="url(#softShadow)">
      <rect x="220" y="596" width="272" height="82" rx="22" fill="#FFFFFF" stroke="#DCE6EF"/>
      <circle cx="256" cy="637" r="18" fill="#F0FDF4"/>
      <path d="M249 637h14" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M256 630v14" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round"/>
      <text x="290" y="630" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#111827">额度可视</text>
      <text x="290" y="655" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">看懂计费与剩余额度</text>
    </g>

    <rect x="560" y="150" width="450" height="560" rx="32" fill="#0F172A"/>
    <rect x="560" y="150" width="450" height="56" rx="32" fill="#111827"/>
    <circle cx="598" cy="178" r="7" fill="#F87171"/>
    <circle cx="624" cy="178" r="7" fill="#FBBF24"/>
    <circle cx="650" cy="178" r="7" fill="#34D399"/>

    <rect x="594" y="238" width="382" height="78" rx="22" fill="#111827" stroke="#243046"/>
    <text x="622" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#E2E8F0">POST /v1/images/tasks</text>
    <text x="622" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#94A3B8">提交异步图片生成 / 编辑任务</text>

    <rect x="594" y="340" width="382" height="118" rx="22" fill="#0B1120" stroke="#243046"/>
    <text x="622" y="374" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#7DD3FC">Authorization: Bearer sk-********</text>
    <text x="622" y="401" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#A7F3D0">model: gpt-image-2-enterprise</text>
    <text x="622" y="428" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#F9A8D4">size: 1024x1024</text>

    <rect x="594" y="480" width="382" height="92" rx="22" fill="#111827" stroke="#243046"/>
    <text x="622" y="515" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#E2E8F0">task_id: task_xxxxxxxxxx</text>
    <text x="622" y="542" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#93C5FD">status: 202 accepted</text>

    <rect x="594" y="592" width="382" height="84" rx="22" fill="#0B1120" stroke="#243046"/>
    <text x="622" y="625" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#C4B5FD">poll → succeeded → /content/0</text>
    <text x="622" y="651" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#94A3B8">异步轮询后获取结果</text>

    <g filter="url(#softShadow)">
      <rect x="516" y="124" width="146" height="42" rx="21" fill="url(#chip)" stroke="#D7E2EB"/>
      <text x="589" y="150" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#0F172A">MaoLao API</text>
    </g>

    <g filter="url(#softShadow)">
      <rect x="872" y="124" width="112" height="42" rx="21" fill="#EFF6FF" stroke="#BFDBFE"/>
      <text x="928" y="150" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#1D4ED8">Images</text>
    </g>
  </g>
</svg>
